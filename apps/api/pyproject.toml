[project]
name = "nodetrail-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.8",
    "fsrs>=6.3.2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=6.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
# Optional `embed` extra; absent in CI, imported lazily in app/rag/embed.py.
module = ["sentence_transformers.*", "sentence_transformers"]
ignore_missing_imports = true
